<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#123B70"/><stop offset="100%" stop-color="#2878B9"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#16324F" flood-opacity=".14"/></filter>
</defs>
<rect width="1200" height="700" fill="#ffffff"/>
<text x="56" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17324D">Task 1 Program Flow</text>
<text x="56" y="94" font-family="Arial,sans-serif" font-size="17" fill="#526579">Student Result Card Generator — input, validation, calculation and report.</text>
<rect x="260" y="135" width="680" height="68" rx="14" fill="#E4F6EA" stroke="#16A36A" stroke-width="2"/><text x="282" y="162" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324D">START</text><text x="282" y="185" font-family="Arial,sans-serif" font-size="14" fill="#334E68">Run the result card program</text><path d="M600 203 V229" stroke="#627D98" stroke-width="2.5" fill="none"/><path d="M594 222 L600 230 L606 222" stroke="#627D98" stroke-width="2.5" fill="none"/><rect x="260" y="229" width="680" height="68" rx="14" fill="#E6F1FB" stroke="#2878B9" stroke-width="2"/><text x="282" y="256" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324D">INPUT STUDENT DETAILS</text><text x="282" y="279" font-family="Arial,sans-serif" font-size="14" fill="#334E68">Read name, then clean using strip() and title().</text><path d="M600 297 V323" stroke="#627D98" stroke-width="2.5" fill="none"/><path d="M594 316 L600 324 L606 316" stroke="#627D98" stroke-width="2.5" fill="none"/><rect x="260" y="323" width="680" height="68" rx="14" fill="#F0E8FC" stroke="#805AD5" stroke-width="2"/><text x="282" y="350" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324D">VALIDATE ROLL NUMBER</text><text x="282" y="373" font-family="Arial,sans-serif" font-size="14" fill="#334E68">Use isdigit(); if invalid, display error and ask again.</text><path d="M600 391 V417" stroke="#627D98" stroke-width="2.5" fill="none"/><path d="M594 410 L600 418 L606 410" stroke="#627D98" stroke-width="2.5" fill="none"/><rect x="260" y="417" width="680" height="68" rx="14" fill="#E6F1FB" stroke="#2878B9" stroke-width="2"/><text x="282" y="444" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324D">INPUT FIVE SUBJECT MARKS</text><text x="282" y="467" font-family="Arial,sans-serif" font-size="14" fill="#334E68">For each subject, request a whole number from 0 to 100.</text><path d="M600 485 V511" stroke="#627D98" stroke-width="2.5" fill="none"/><path d="M594 504 L600 512 L606 504" stroke="#627D98" stroke-width="2.5" fill="none"/><rect x="260" y="511" width="680" height="68" rx="14" fill="#F0E8FC" stroke="#805AD5" stroke-width="2"/><text x="282" y="538" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324D">VALIDATE EACH MARK</text><text x="282" y="561" font-family="Arial,sans-serif" font-size="14" fill="#334E68">If invalid or out of range, repeat that subject prompt.</text><path d="M600 579 V605" stroke="#627D98" stroke-width="2.5" fill="none"/><path d="M594 598 L600 606 L606 598" stroke="#627D98" stroke-width="2.5" fill="none"/><rect x="260" y="605" width="680" height="68" rx="14" fill="#F8FAFC" stroke="#829AB1" stroke-width="2"/><text x="282" y="632" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324D">CALCULATE RESULT</text><text x="282" y="655" font-family="Arial,sans-serif" font-size="14" fill="#334E68">Sum marks, calculate percentage, and select percentage grade.</text><path d="M600 673 V699" stroke="#627D98" stroke-width="2.5" fill="none"/><path d="M594 692 L600 700 L606 692" stroke="#627D98" stroke-width="2.5" fill="none"/><rect x="260" y="699" width="680" height="68" rx="14" fill="#F0E8FC" stroke="#805AD5" stroke-width="2"/><text x="282" y="726" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324D">CHECK SUBJECT RULE</text><text x="282" y="749" font-family="Arial,sans-serif" font-size="14" fill="#334E68">If any subject is below 40, final status is Fail; otherwise use 50% pass threshold.</text><path d="M600 767 V793" stroke="#627D98" stroke-width="2.5" fill="none"/><path d="M594 786 L600 794 L606 786" stroke="#627D98" stroke-width="2.5" fill="none"/><rect x="260" y="793" width="680" height="68" rx="14" fill="#E4F6EA" stroke="#16A36A" stroke-width="2"/><text x="282" y="820" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324D">DISPLAY RESULT CARD</text><text x="282" y="843" font-family="Arial,sans-serif" font-size="14" fill="#334E68">Print student details, marks, total, percentage, grade and status.</text><path d="M600 861 V887" stroke="#627D98" stroke-width="2.5" fill="none"/><path d="M594 880 L600 888 L606 880" stroke="#627D98" stroke-width="2.5" fill="none"/><rect x="260" y="887" width="680" height="68" rx="14" fill="#E4F6EA" stroke="#16A36A" stroke-width="2"/><text x="282" y="914" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324D">END</text><text x="282" y="937" font-family="Arial,sans-serif" font-size="14" fill="#334E68">Program finishes.</text></svg>