<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#123B70"/><stop offset="100%" stop-color="#2878B9"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#16324F" flood-opacity=".14"/></filter>
</defs>
<rect width="1200" height="700" fill="#ffffff"/>
<text x="56" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17324D">Project Overview</text>
<text x="56" y="94" font-family="Arial,sans-serif" font-size="17" fill="#526579">Two independent console applications built with core Python concepts.</text>
<rect x="56" y="135" width="520" height="220" rx="16" fill="#F8FAFC" stroke="#D9E2EC" filter="url(#shadow)"/><rect x="56" y="135" width="8" height="220" rx="4" fill="#2878B9"/><text x="80" y="169" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17324D">Task 1 — Student Result Card</text><text x="80" y="203" font-family="Arial,sans-serif" font-size="15" fill="#334E68">File: result_card_generator.py</text><text x="80" y="228" font-family="Arial,sans-serif" font-size="15" fill="#334E68">Topic: functions and string manipulation</text><text x="80" y="253" font-family="Arial,sans-serif" font-size="15" fill="#334E68">Input: name, digit-only roll number, five subject marks</text><text x="80" y="278" font-family="Arial,sans-serif" font-size="15" fill="#334E68">Rules: marks 0–100; any mark below 40 forces Fail</text><text x="80" y="303" font-family="Arial,sans-serif" font-size="15" fill="#334E68">Output: total, percentage, grade and final status</text><text x="80" y="328" font-family="Arial,sans-serif" font-size="15" fill="#334E68">Concepts: def, parameters, return, f-strings, dictionaries</text><rect x="624" y="135" width="520" height="220" rx="16" fill="#F8FAFC" stroke="#D9E2EC" filter="url(#shadow)"/><rect x="624" y="135" width="8" height="220" rx="4" fill="#16A36A"/><text x="648" y="169" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17324D">Task 2 — Class Marks Analyzer</text><text x="648" y="203" font-family="Arial,sans-serif" font-size="15" fill="#334E68">File: class_marks_analyzer.py</text><text x="648" y="228" font-family="Arial,sans-serif" font-size="15" fill="#334E68">Topic: lists and loops</text><text x="648" y="253" font-family="Arial,sans-serif" font-size="15" fill="#334E68">Input: class size, each student name and mark</text><text x="648" y="278" font-family="Arial,sans-serif" font-size="15" fill="#334E68">Rules: positive class size; marks 0–100</text><text x="648" y="303" font-family="Arial,sans-serif" font-size="15" fill="#334E68">Output: average, extremes, pass/fail counts and ranking</text><text x="648" y="328" font-family="Arial,sans-serif" font-size="15" fill="#334E68">Concepts: append, len, sum, max, min, sorted, loops</text><rect x="56" y="390" width="1088" height="190" rx="16" fill="#F8FAFC" stroke="#D9E2EC" filter="url(#shadow)"/><rect x="56" y="390" width="8" height="190" rx="4" fill="#805AD5"/><text x="80" y="424" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17324D">Shared Design Principles</text><text x="80" y="458" font-family="Arial,sans-serif" font-size="15" fill="#334E68">Separate programs • reusable custom functions • input validation with retry loops</text><text x="80" y="483" font-family="Arial,sans-serif" font-size="15" fill="#334E68">Readable terminal reports • meaningful names • comments and docstrings</text><text x="80" y="508" font-family="Arial,sans-serif" font-size="15" fill="#334E68">Tested with successful, failing, boundary and invalid-input scenarios</text></svg>